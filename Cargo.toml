[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.dependencies]
proptest = "1.12.0"
nix = { version = "0.30", features = ["signal"] }
ratatui = "0.30"
regex = "1.12"
reqwest = { version = "0.13", features = ["blocking", "json"] }
saphyr = { version = "0.2.2", default-features = false }
serde_json = { version = "1.0", features = ["preserve_order"] }
signal-hook = "0.3.18"
tempfile = "3.23"
uuid = { version = "1.28", features = ["v4"] }
walkdir = "2.5"

[workspace.lints.clippy]
all = "warn"
doc_link_code = "warn"
expect_used = "warn"
missing_const_for_fn = "warn"
option_if_let_else = "warn"
panic = "warn"
pedantic = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
significant_drop_tightening = "warn"
suboptimal_flops = "warn"
todo = "warn"
unwrap_used = "warn"
use_self = "warn"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.package]
edition = "2024"
version = "0.2.1-rc.2"
license = "MIT"
rust-version = "1.89"

[workspace.metadata.crane]
name = "deepseek-harness"

[workspace.metadata.mutants]
# Pure crates must report zero surviving mutants.
no_std_crates = [
  "dsh-args",
  "dsh-agent",
  "dsh-profile",
  "dsh-config",
  "dsh-shutdown",
  "dsh-diagnostics",
]
